site_name: GeometricAI
site_description: Modular, explainable, and controllable artificial brain systems
site_url: https://ArtificialBrainStudio.github.io/GeometricAI/

theme:
  name: material

  logo: assets/logo-horizontal.png
  favicon: assets/logo-mark.png

  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ArtificialBrainStudio/GeometricAI
      name: GeometricAI on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/geometric-ai-undercontrol/
      name: LinkedIn
    - icon: fontawesome/solid/globe
      link: https://ArtificialBrainStudio.github.io/GeometricAI/
      name: Website
    - icon: fontawesome/regular/envelope
      link: mailto:mehmet.yamac@tuni.fi
      name: Email
  generator: false

copyright: "Copyright &copy; 2026 <strong>GeometricAI</strong> &nbsp;&middot;&nbsp; Modular. Explainable. Controllable."

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Projects: projects.md
  - Publications: publications.md
  - Team: team.md
  - News: news.md
  - Contact: contact.md
